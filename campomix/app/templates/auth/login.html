<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión | Campomix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg,
                    #E5F4EA,
                    #FFF7E9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(35, 122, 87, .12);
        }

        .brand-icon {
            font-size: 3.5rem;
            color: #237A57;
        }

        .btn-login {
            background-color: #237A57;
            color: white;
            border: none;
            font-weight: 600;
        }

        .btn-login:hover {
            background-color: #194F3B;
            color: white;
        }

        .form-control:focus {
            border-color: #F59E38;
            box-shadow: 0 0 0 .2rem rgba(245, 158, 56, .18);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card login-card mx-auto">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <i class="bi bi-droplet-half brand-icon"></i>

                    <h2 class="fw-bold mt-2">CAMPOMIX</h2>

                    <p class="text-muted">
                        Sistema de Gestión de Productos Lácteos
                    </p>
                </div>

                <h5 class="text-center mb-4">
                    Iniciar sesión
                </h5>

                {% with mensajes = get_flashed_messages(with_categories=true) %}
                {% for categoria, mensaje in mensajes %}
                <div class="alert alert-{{ categoria }}" role="alert">
                    {{ mensaje }}
                </div>
                {% endfor %}
                {% endwith %}

                <form method="POST" action="{{ url_for('auth.login') }}">

                    <div class="mb-3">
                        <label class="form-label">
                            Usuario
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input type="text" name="usuario" class="form-control" placeholder="Ingrese su usuario"
                                autocomplete="username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Contraseña
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input type="password" name="password" class="form-control"
                                placeholder="Ingrese su contraseña" autocomplete="current-password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login w-100 py-2">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Ingresar
                    </button>

                </form>

                <p class="text-center text-muted small mt-4 mb-0">
                    © Campomix - Sistema de Gestión
                </p>

            </div>
        </div>
    </div>

</body>

</html>
